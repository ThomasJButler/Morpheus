# ============================================================================
# Morpheus in containers. Optional: running `uvicorn` and `npm run dev` on
# the host is the primary path and needs nothing from this file.
#
# NOT YET VERIFIED with a real `docker compose up` (Docker was being
# reinstalled on the dev machine when this was written). The contract it
# implements:
#   - both ports publish on 127.0.0.1 only, so nothing on the LAN can reach
#     an app that has no authentication;
#   - Ollama stays on the HOST (models want the host's RAM/GPU); the backend
#     reaches it via host.docker.internal;
#   - the library bind-mounts to ./backend/data, so documents survive
#     container rebuilds and remain visible as plain files you can delete.
#
# Prerequisites on the host: Ollama running, with
#   ollama pull nomic-embed-text
#   ollama pull qwen3.5:9b
# ============================================================================

services:
  backend:
    build: ./backend
    container_name: morpheus-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATA_DIR=/data
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # Your library. On Docker Desktop (macOS/Windows) bind-mount ownership
      # maps to your user automatically; on Linux, chown ./backend/data to
      # uid 1000 or switch this to a named volume.
      - ./backend/data:/data
    extra_hosts:
      # Docker Desktop provides host.docker.internal natively; Linux needs
      # this mapping.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: morpheus-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8000
    volumes:
      - ./frontend/src:/app/src
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend-node-modules:
