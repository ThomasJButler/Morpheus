name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: ./frontend
        run: npm run test:ci

      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: No font, analytics or CDN hosts in the bundle
        working-directory: ./frontend
        # Any URL-shaped string is too broad (framework chunks carry
        # documentation links and licence banners); these are the hosts a
        # "runs entirely on your machine" app must never load from.
        run: |
          if grep -rEo 'fonts\.googleapis|fonts\.gstatic|googletagmanager|google-analytics|sentry\.io|posthog|plausible\.io|segment\.io|hotjar|intercom|cdn\.jsdelivr|unpkg\.com|cdnjs\.cloudflare' .next/static .next/server; then
            echo "external host baked into the bundle"; exit 1
          fi
          echo "bundle clean"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (includes the no-external-request check)
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
