name: Backend

# Everything the backend needs is on the machine. The test job proves it:
# pytest runs inside a Linux network namespace that has only the loopback
# interface, so any dependency that tries to reach the internet fails the
# build at the kernel, not in a mock. No API keys exist any more, so none
# are passed in.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        working-directory: ./backend
        run: ruff check app tests

      - name: Known vulnerabilities in the dependency tree
        working-directory: ./backend
        run: pip-audit

      - name: Tests, with no network at all
        working-directory: ./backend
        # unshare -n creates a network namespace with only `lo`; nothing in
        # it can reach anything but 127.0.0.1. The Ollama integration test
        # sees no server on 11434 and skips; everything else must pass.
        run: |
          sudo -E env "PATH=$PATH" unshare -n bash -c '
            ip link set lo up
            python -m pytest -q
          '
